{% load static %}{% if ACTIVITY_DEBUG_SIDEBAR_ENABLED %}
<style>
    /* Pushes the page's own content over instead of letting the sidebar cover it - toggled by
       debug_sidebar.js adding/removing this class on <html>. Width must match the panel's. */
    html.activity-debug-sidebar-open body > main {
        margin-right: 380px;
        transition: margin-right 0.2s ease;
    }
</style>
<script>
    window.ACTIVITY_DEBUG_SESSIONS_URL = "{% url 'activity:debug_sessions' %}";
    window.ACTIVITY_DEBUG_SESSION_STEPS_URL_TEMPLATE = "{% url 'activity:debug_session_steps' '__SESSION_KEY__' %}";
</script>
<div id="activity-debug-sidebar" style="position: fixed; top: 0; right: 0; height: 100vh; z-index: 9999; display: flex; font-family: monospace; font-size: 13px; pointer-events: none;">
    <button id="activity-debug-sidebar-toggle"
            title="Activity debug sidebar"
            style="align-self: flex-start; margin-top: 12px; background: #1f2937; color: #fff; border: none; padding: 8px 10px; cursor: pointer; border-radius: 6px 0 0 6px; pointer-events: auto;">
        &#128027;
    </button>
    <div id="activity-debug-sidebar-panel" style="display: none; flex-direction: column; width: 380px; max-width: 90vw; height: 100%; background: #111827; color: #e5e7eb; border-left: 1px solid #374151; pointer-events: auto;">
        <div style="padding: 10px 12px; border-bottom: 1px solid #374151; font-weight: 600;">
            Activity Debug Sidebar
        </div>
        <div id="activity-debug-sidebar-body" style="flex: 1; overflow-y: auto;">
            Click &#128027; to load recorded sessions.
        </div>
    </div>
</div>
<script src="{% static "activity/debug_sidebar.js" %}" defer></script>
{% endif %}
